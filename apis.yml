name: Standard AI
description: 'Standard AI, formerly Standard Cognition, is a computer-vision company
  that builds AI-powered autonomous (checkout-free) shopping technology for physical
  retail. Using ceiling-mounted cameras and machine-learning models, its platform lets
  shoppers pick up items and walk out without scanning or waiting in line, while giving
  retailers real-time inventory and shopper analytics. The company is backed by CRV,
  EQT Ventures, SoftBank Vision Fund and SV Angel, and maintains a public open-source
  organization on GitHub. Standard AI does not publish a public developer API, and its
  main website is served behind a bot-challenge gateway.'
